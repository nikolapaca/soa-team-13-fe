<div class="kp-card" aria-label="Key point card">
  <div *ngIf="status === 0" class="kp-toolbar">
    <button class="icon-btn" type="button" (click)="onEditClick()" aria-label="Izmeni">
      <!-- pencil icon -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
      </svg>
    </button>
    <button class="icon-btn danger" type="button" (click)="onDeleteClick()" aria-label="Obriši">
      <!-- trash icon -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
      </svg>
    </button>
  </div>

 <div class="kp-image-wrap">
  <img
    [src]="imgSrc"
    [alt]="keyPoint.name || 'Key point'"
    (load)="onImgLoad()"
    (error)="onImgError()"
    decoding="async"
    referrerpolicy="no-referrer"
  />
</div>

  <div class="kp-content">
    <h3 class="kp-title" [title]="keyPoint.name">{{ keyPoint.name }}</h3>
    <p class="kp-desc">{{ keyPoint.description }}</p>
  </div>
</div>
