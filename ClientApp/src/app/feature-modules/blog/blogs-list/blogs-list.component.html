<div class="header-container">
  <h2>Blogovi</h2>
  <button class="add-button" [routerLink]="['/add-blog']">
    Dodaj Blog
  </button>
</div>

<div class="blogs-container">
  <div *ngFor="let blog of blogs" class="blog-card" [routerLink]="['/blogs', blog._id]">
    <img *ngIf="blog.image_url" [src]="'http://localhost:8070' + blog.image_url" alt="{{ blog.title }}" class="blog-image">
    <h3>{{ blog.title }}</h3>
  </div>
</div>
