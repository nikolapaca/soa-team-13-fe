<div class="profile-layout">
  <div class="profile-left">
    <div class="avatar-wrap">
      <img src="profilepic.jpg" alt="Profilna slika" />

    </div>
  </div>

  <div class="profile-right">
    <div class="field">
      <label>Ime</label>
      <ng-container *ngIf="!editing; else editNameTpl">
        <p class="field-value">{{ profile?.name || '—' }}</p>
      </ng-container>
      <ng-template #editNameTpl>
        <input [(ngModel)]="editName" />
      </ng-template>
    </div>

    <div class="field">
      <label>Prezime</label>
      <ng-container *ngIf="!editing; else editSurnameTpl">
        <p class="field-value">{{ profile?.surname || '—' }}</p>
      </ng-container>
      <ng-template #editSurnameTpl>
        <input [(ngModel)]="editSurname" />
      </ng-template>
    </div>

    <div class="field">
      <label>Moto</label>
      <ng-container *ngIf="!editing; else editMottoTpl">
        <p class="field-value">{{ profile?.motto || '—' }}</p>
      </ng-container>
      <ng-template #editMottoTpl>
        <input [(ngModel)]="editMotto" />
      </ng-template>
    </div>

    <div class="field">
      <label>Bio</label>
      <ng-container *ngIf="!editing; else editBioTpl">
        <p class="field-value multiline">{{ profile?.bio || '—' }}</p>
      </ng-container>
      <ng-template #editBioTpl>
        <textarea [(ngModel)]="editBio"></textarea>
      </ng-template>
    </div>

    <button (click)="toggleEdit()">
      {{ editing ? 'Save' : 'Edit' }}
    </button>
  </div>
</div>
